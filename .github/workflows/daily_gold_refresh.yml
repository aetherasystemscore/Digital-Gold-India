name: Daily India Gold Rate & Offer Verification Refresh

on:
  schedule:
    # Runs twice daily at 09:30 AM IST (04:00 UTC) and 06:30 PM IST (13:00 UTC), Mon-Sat
    # Aligns with IBJA AM/PM rate publication and NSE market hours
    - cron: '0 4,13 * * 1-6'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Live Gold Benchmark, ETF & Offer Verification Pipeline
        run: |
          python gold_verification_engine.py --refresh

      - name: Commit updated verified snapshot & SQLite audit log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest_verified_snapshot.json data/gold_audit_history.db
          git diff --staged --quiet || git commit -m "chore(data): daily verified gold benchmarks, ETFs & offer audit [skip ci]"
          git push
